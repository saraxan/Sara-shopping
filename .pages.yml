media:
  input: images
  output: images

content:
  - name: products
    label: بەرهەمەکان
    type: file
    path: products.json
    list: true
    fields:
      - name: id
        label: کۆدی بەرهەم (id)
        type: string
      - name: name
        label: ناوی بەرهەم
        type: string
      - name: english
        label: ناوی ئینگلیزی
        type: string
      - name: category
        label: جۆر
        type: select
        options:
          values: [perfume, skincare, makeup]
      - name: type
        label: جۆری بەرهەم
        type: string
      - name: desc
        label: وەسف
        type: text
      - name: price
        label: نرخ
        type: number
      - name: oldPrice
        label: نرخی کۆن
        type: number
      - name: shape
        label: شێواز
        type: select
        options:
          values: [bottle, jar, lip]
      - name: tag
        label: تاگ
        type: string
      - name: image
        label: وێنەی سەرەکی
        type: string
      - name: gallery
        label: گەلەری
        type: string
        list: true
      - name: variants
        label: قەبارەکان
        type: string
        list: true
