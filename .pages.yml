media:
  input: images
  output: images

content:
  - name: products
    label: بەرهەمەکان
    type: file
    path: products.json
    list: true
    fields:
      - name: id
        label: کۆدی بەرهەم (id)
        type: string
        required: true
      - name: name
        label: ناوی بەرهەم
        type: string
        required: true
      - name: english
        label: ناوی ئینگلیزی
        type: string
      - name: category
        label: جۆر
        type: select
        options:
          values: [perfume, skincare, makeup]
      - name: type
        label: جۆری بەرهەم
        type: string
      - name: desc
        label: وەسف
        type: text
      - name: price
        label: نرخی سەرەکی
        type: number
        required: true
      - name: oldPrice
        label: نرخی کۆن
        type: number
      - name: shape
        label: شێواز
        type: select
        options:
          values: [bottle, jar, lip]
        default: bottle
      - name: tag
        label: تاگ
        type: string
      - name: image
        label: وێنەی سەرەکی
        type: image
      - name: gallery
        label: وێنەکانی سەرەکی تر (گەلەری)
        type: list
        field:
          type: image
      - name: variants
        label: قەبارەکان و نرخەکان (35ml, 50ml...)
        type: list
        fields:
          - name: size
            label: قەبارە (نموونە: 35ml)
            type: string
          - name: price
            label: نرخی ئەم قەبارەیە
            type: number
          - name: oldPrice
            label: نرخی کۆنی ئەم قەبارەیە
            type: number
          - name: gallery
            label: وێنەکانی تایبەت بەم قەبارەیە
            type: list
            field:
              type: image
      - name: ingredients
        label: پێکهاتەکان
        type: list
        field:
          type: string
