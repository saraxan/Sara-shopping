<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FAF8F5">
<title>وردەکاری بەرهەم | Sara Beauty Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#B87B85;
  --ink:#2C2829;
  --muted:#7A6F71;
  --bg:#FAF8F5;
  --line:#EBE3DF;
  --red:#d32f2f;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg); color:var(--ink); font-family:'Noto Kufi Arabic',Tahoma,sans-serif; line-height:1.8; font-size:15px; -webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
img{max-width:100%;display:block}

/* HEADER */
header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 0;}
.container{width:min(800px,calc(100% - 24px));margin:auto}
.nav{display:flex;align-items:center;justify-content:space-between;gap:14px;}
.brand{font-size:22px;font-weight:700;letter-spacing:-.5px;color:var(--ink);}
.icon-btn{position:relative;display:flex;flex-direction:column;align-items:center;font-size:11px;gap:2px;}
.icon-btn svg{width:22px;height:22px;stroke-width:1.8;}
.cart-count{position:absolute;top:-4px;right:-6px;background:var(--teal);color:#fff;font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:50%;display:grid;place-items:center;}

/* PRODUCT IMAGES & GALLERY */
.product-wrap{padding: 20px 0 100px;}
.main-image{width: 100%;aspect-ratio: 1/1;border-radius: 20px;overflow: hidden;background: #fff;margin-bottom: 12px;border: 1px solid var(--line);}
.main-image img{width: 100%;height: 100%;object-fit: contain;}
.main-image .placeholder{width: 100%;height: 100%;display:grid;place-items:center;font-size:50px;color:#ccc;}

/* Thumbnails */
.gallery-thumbs {display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px;}
.gallery-thumbs::-webkit-scrollbar { display: none; }
.thumb {width: 70px; height: 70px; border-radius: 10px; flex-shrink: 0; border: 2px solid transparent; background: #fff; overflow: hidden; cursor: pointer; transition: 0.2s; border: 1px solid var(--line);}
.thumb.active, .thumb:hover { border-color: var(--teal); }
.thumb img { width: 100%; height: 100%; object-fit: cover; }

/* PRODUCT DETAILS */
.prod-title{font-size: 22px;font-weight: 700;color: var(--ink);margin-bottom: 6px;line-height: 1.4;}
.prod-title small{display: block;font-size: 15px;color: var(--muted);font-weight: 400;margin-top: 4px;}

/* Price Area */
.price-area {display: flex; align-items: center; gap: 10px; margin-bottom: 24px; flex-wrap: wrap;}
.prod-price { font-size: 28px; font-weight: 700; color: var(--red); }
.prod-old-price { font-size: 16px; color: var(--muted); text-decoration: line-through; }
.discount-badge { background: var(--red); color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 4px; font-weight: bold; }

/* Size/Variants */
.variants-title { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
.variants-grid { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 24px; padding-bottom: 10px; }
.variants-grid::-webkit-scrollbar { display: none; }
.size-btn {border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 10px 15px; display: flex; flex-direction: column; align-items: center; min-width: 100px; flex-shrink: 0; transition: 0.2s;}
.size-btn.active { border-color: var(--ink); border-width: 2px; }
.size-btn-img { width: 40px; height: 40px; object-fit: contain; margin-bottom: 5px; }
.size-btn-old { font-size: 11px; color: var(--muted); text-decoration: line-through; }
.size-btn-price { font-size: 14px; font-weight: bold; color: var(--red); }
.size-btn-label { font-size: 13px; font-weight: bold; margin-top: 4px; }

.prod-desc{font-size: 15px;color: var(--ink);line-height: 2;margin-bottom: 30px;white-space: pre-wrap;}

/* BOTTOM ACTION BAR */
.bottom-bar{position: fixed;bottom: 0;left: 0;right: 0;background: var(--bg);padding: 12px 16px;border-top: 1px solid var(--line);display: flex;align-items: center;gap: 12px;z-index: 90;box-shadow: 0 -4px 12px rgba(0,0,0,.03);}
.qty-box{display: flex;align-items: center;border: 1px solid #ccc;border-radius: 999px;height: 48px;overflow: hidden;}
.qty-box button{width: 40px;height: 100%;font-size: 18px;color: var(--ink);display: grid;place-items: center;}
.qty-box input{width: 40px;height: 100%;text-align: center;border: 0;outline: 0;font-family: inherit;font-size: 15px;font-weight: 600;background: transparent;}
.btn-add{flex: 1;height: 48px;background: var(--ink);color: #fff;border-radius: 999px;font-size: 16px;font-weight: 600;display: flex;align-items: center;justify-content: center;gap: 8px;transition: .2s;}
.btn-add:hover{background: var(--teal);}

/* FLOATING WA */
.wa-float{position:fixed;bottom:80px;left:20px;width:50px;height:50px;border-radius:50%;background:#25a85a;color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(37,168,90,.4);z-index:60;}
.wa-float svg{width:24px;height:24px}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(10px);background:#222;color:#fff;padding:10px 20px;border-radius:10px;font-size:12px;z-index:70;opacity:0;pointer-events:none;transition:.3s;white-space: nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(min-width:600px){
  .prod-title{font-size: 26px;}
  .prod-price{font-size: 32px;}
}
</style>
</head>
<body>

<header>
  <div class="container nav">
    <a href="index.html" class="icon-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </a>
    <a href="index.html" class="brand">Sara Beauty Shop</a>
    <button class="icon-btn" id="openCart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>
</header>

<main class="container product-wrap" id="productWrap">
  <div style="text-align:center;padding:50px 0;color:var(--muted)">بەرهەم بار دەکرێت...</div>
</main>

<div class="bottom-bar" id="actionBar" style="display:none">
  <div class="qty-box">
    <button type="button" id="qtyMinus">−</button>
    <input type="number" id="qtyInput" value="1" min="1" readonly>
    <button type="button" id="qtyPlus">+</button>
  </div>
  <button class="btn-add" id="addToCartBtn">زیادکردن بۆ سەبەتە</button>
</div>

<a href="#" class="wa-float" id="waFloat">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
</a>

<div class="toast" id="toast"></div>

<aside id="cartPanel" style="position:fixed;top:0;left:0;width:min(400px,100%);height:100dvh;background:#fff;box-shadow:-5px 0 15px rgba(0,0,0,0.1);transform:translateX(-110%);transition:transform .3s;padding:20px;display:flex;flex-direction:column;z-index:100">
  <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px">
    <h3 style="font-size:18px">سەبەتەی کڕین</h3>
    <button id="closeCart" style="font-size:20px;color:#777">✕</button>
  </div>
  <div id="cartItems" style="flex:1;overflow:auto;padding-bottom:16px"></div>
  <div style="border-top:1px solid var(--line);padding-top:16px">
    <div style="display:flex;justify-content:space-between;font-weight:700;margin-bottom:14px;font-size:15px">
      <span>کۆی گشتی</span>
      <span id="cartTotal" style="color:var(--teal)">٠ د.ع</span>
    </div>
    <button class="btn-add" id="checkoutBtn" style="width:100%">ناردنی داواکاری بە واتساپ</button>
  </div>
</aside>

<script>
const WHATSAPP_NUMBER = "9647744484966";
let PRODUCTS = [];
let CURRENT = null;
let qty = 1;
let selectedVariantIndex = 0;
let cart = {};
let defaultGallery = [];

const fmt = n => new Intl.NumberFormat("ckb-IQ").format(n) + " د.ع";
const escapeHTML = v => String(v??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function loadProducts(){
  try{
    const r = await fetch('products.json', {cache:'no-store'});
    if(r.ok){ const d = await r.json(); if(Array.isArray(d)) PRODUCTS = d; }
  }catch(e){ console.warn(e); }
}

function getId(){ return new URLSearchParams(location.search).get("id"); }

function renderDetail(){
  const id = getId();
  CURRENT = PRODUCTS.find(p => p.id === id);
  const wrap = document.getElementById("productWrap");

  if(!CURRENT){
    wrap.innerHTML = '<div style="text-align:center;padding:80px 0;color:var(--muted)">بەرهەمەکە نەدۆزرایەوە 🌸<br><br><a href="index.html" style="color:var(--teal);font-weight:bold">گەڕانەوە بۆ ماڵەوە</a></div>';
    return;
  }

  document.title = CURRENT.name + " | Sara Beauty Shop";
  document.getElementById("actionBar").style.display = "flex";

  // وێنەکانی سەرەکی بەرهەم
  if (CURRENT.gallery && CURRENT.gallery.length > 0) defaultGallery = CURRENT.gallery;
  else if (CURRENT.image) defaultGallery = [CURRENT.image];
  else defaultGallery = [];

  let variantsHTML = "";
  if (CURRENT.variants && CURRENT.variants.length > 0) {
    variantsHTML = `
      <div class="variants-title">قەبارە هەڵبژێرە:</div>
      <div class="variants-grid" id="variantsGrid">
        ${CURRENT.variants.map((v, i) => `
          <button class="size-btn ${i===0?'active':''}" onclick="selectVariant(${i})" id="variant-btn-${i}">
            ${(v.gallery && v.gallery.length > 0) ? `<img src="${escapeHTML(v.gallery[0])}" class="size-btn-img">` : (v.image ? `<img src="${escapeHTML(v.image)}" class="size-btn-img">` : '')}
            ${v.oldPrice ? `<span class="size-btn-old">${fmt(v.oldPrice)}</span>` : ''}
            <span class="size-btn-price">${fmt(v.price)}</span>
            <span class="size-btn-label">${escapeHTML(v.size)}</span>
          </button>
        `).join("")}
      </div>
    `;
  } else {
    let oldPriceHTML = CURRENT.oldPrice ? `<span class="prod-old-price">${fmt(CURRENT.oldPrice)}</span>` : '';
    let discountHTML = (CURRENT.oldPrice && CURRENT.oldPrice > CURRENT.price) ? 
      `<span class="discount-badge">${Math.round((1 - CURRENT.price/CURRENT.oldPrice) * 100)}%-</span>` : '';
      
    variantsHTML = `
      <div class="price-area" id="standardPriceArea">
        <span class="prod-price" id="mainPrice">${fmt(CURRENT.price)}</span>
        ${oldPriceHTML}
        ${discountHTML}
      </div>
    `;
  }

  wrap.innerHTML = `
    <div id="galleryContainer"></div>
    <h1 class="prod-title">
      ${escapeHTML(CURRENT.name)}
      ${CURRENT.english ? `<small>${escapeHTML(CURRENT.english)}</small>` : ""}
    </h1>
    ${variantsHTML}
    <div class="prod-desc">${escapeHTML(CURRENT.desc || "هیچ وەسفێک نەنووسراوە.")}</div>
  `;

  renderGallery(defaultGallery);

  if (CURRENT.variants && CURRENT.variants.length > 0) {
    setTimeout(() => selectVariant(0), 100);
  }
}

function renderGallery(images) {
  const container = document.getElementById("galleryContainer");
  if (!images || images.length === 0) {
    container.innerHTML = `<div class="main-image"><div class="placeholder">📦</div></div>`;
    return;
  }

  let mainImgHTML = `<img id="mainImg" src="${escapeHTML(images[0])}" alt="">`;
  let thumbsHTML = "";
  
  if (images.length > 1) {
    thumbsHTML = `<div class="gallery-thumbs">` + images.map((img, i) => 
      `<div class="thumb ${i===0?'active':''}" onclick="changeMainImg(this, '${escapeHTML(img)}')">
          <img src="${escapeHTML(img)}" alt="">
      </div>`
    ).join("") + `</div>`;
  }

  container.innerHTML = `
    <div class="main-image">${mainImgHTML}</div>
    ${thumbsHTML}
  `;
}

function changeMainImg(el, src) {
  document.getElementById("mainImg").src = src;
  document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}

function selectVariant(index) {
  selectedVariantIndex = index;
  const v = CURRENT.variants[index];
  
  document.querySelectorAll('.size-btn').forEach((btn, i) => {
    if(i === index) btn.classList.add('active');
    else btn.classList.remove('active');
  });

  let area = document.getElementById('standardPriceArea');
  let oldPriceHTML = v.oldPrice ? `<span class="prod-old-price">${fmt(v.oldPrice)}</span>` : '';
  let discountHTML = (v.oldPrice && v.oldPrice > v.price) ? 
      `<span class="discount-badge">${Math.round((1 - v.price/v.oldPrice) * 100)}%-</span>` : '';

  if(area) {
    area.innerHTML = `
      <span class="prod-price">${fmt(v.price)}</span>
      ${oldPriceHTML}
      ${discountHTML}
    `;
  }
  
  // گۆڕینی گەلەری بەپێی قەبارەکە
  if (v.gallery && v.gallery.length > 0) {
    renderGallery(v.gallery);
  } else if (v.image) {
    renderGallery([v.image]); // بۆ کۆدی کۆن
  } else {
    renderGallery(defaultGallery); // ئەگەر وێنەی تایبەت نەبوو، وێنەکانی سەرەکی نیشان دەدات
  }
}

function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2000);
}

function updateCartBadge(){
  const count = Object.values(cart).reduce((s,n) => s + n, 0);
  document.getElementById("cartCount").textContent = count;
}

function renderCart(){
  const entries = Object.entries(cart).filter(([,n]) => n > 0);
  const total = entries.reduce((s,[id,n]) => {
    let price = 0;
    if (id.includes("_")) {
      const baseId = id.split("_")[0];
      const size = id.split("_")[1];
      const p = PRODUCTS.find(x => x.id === baseId);
      if(p && p.variants) {
        const v = p.variants.find(v => v.size === size);
        if(v) price = v.price;
      }
    } else {
      const p = PRODUCTS.find(x => x.id === id);
      if(p) price = p.price;
    }
    return s + (price * n);
  }, 0);
  
  document.getElementById("cartTotal").textContent = fmt(total);

  const box = document.getElementById("cartItems");
  if(!entries.length){
    box.innerHTML = '<div style="text-align:center;color:#999;padding:30px 0;font-size:13px">سەبەتەکەت بەتاڵە</div>';
    return;
  }
  box.innerHTML = entries.map(([id,n]) => {
    let name = "";
    const baseId = id.split("_")[0];
    const size = id.split("_")[1] || "";
    const p = PRODUCTS.find(x => x.id === baseId);
    if(p) name = p.name + (size ? ` (${size})` : "");

    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)">
      <div><div style="font-size:13px;font-weight:600">${name}</div></div>
      <div style="display:flex;align-items:center;gap:8px">
        <button onclick="changeQty('${id}', -1)" style="width:26px;height:26px;border-radius:50%;background:#f0f0f0">−</button>
        <span style="font-size:13px">${n}</span>
        <button onclick="changeQty('${id}', 1)" style="width:26px;height:26px;border-radius:50%;background:#f0f0f0">+</button>
      </div>
    </div>`;
  }).join("");
}

function changeQty(id, delta) {
  cart[id] = (cart[id] || 0) + delta;
  if(cart[id] <= 0) delete cart[id];
  updateCartBadge();
  renderCart();
}

document.getElementById("qtyMinus").addEventListener("click", () => { if(qty > 1){ qty--; document.getElementById("qtyInput").value = qty; } });
document.getElementById("qtyPlus").addEventListener("click", () => { qty++; document.getElementById("qtyInput").value = qty; });

document.getElementById("addToCartBtn").addEventListener("click", () => {
  if(!CURRENT) return;
  let cartItemId = CURRENT.id;
  if (CURRENT.variants && CURRENT.variants.length > 0) {
    const selectedSize = CURRENT.variants[selectedVariantIndex].size;
    cartItemId = CURRENT.id + "_" + selectedSize;
  }
  cart[cartItemId] = (cart[cartItemId] || 0) + qty;
  updateCartBadge();
  renderCart();
  toast(qty + " دانە زیادکرا بۆ سەبەتە 🌸");
});

document.getElementById("openCart").addEventListener("click", () => document.getElementById("cartPanel").style.transform = "translateX(0)");
document.getElementById("closeCart").addEventListener("click", () => document.getElementById("cartPanel").style.transform = "translateX(-110%)");

document.getElementById("checkoutBtn").addEventListener("click", () => {
  const entries = Object.entries(cart).filter(([,n]) => n > 0);
  if(!entries.length) return;
  let lines = [];
  let total = 0;
  entries.forEach(([id,n]) => {
    const baseId = id.split("_")[0];
    const size = id.split("_")[1] || "";
    const p = PRODUCTS.find(x => x.id === baseId);
    if(p) {
      let price = p.price;
      if(size && p.variants) {
        const v = p.variants.find(v => v.size === size);
        if(v) price = v.price;
      }
      let name = p.name + (size ? ` (${size})` : "");
      lines.push(`• ${name} — ${n} دانە — ${fmt(price * n)}`);
      total += (price * n);
    }
  });
  window.open("https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent("سڵاو Sara Beauty Shop 🌸\nدەمەوێت ئەم بەرهەمانە داوا بکەم:\n" + lines.join("\n") + "\n\nکۆی گشتی: " + fmt(total) + "\nناو:\nشار و ناونیشان:"), "_blank");
});

document.getElementById("waFloat").addEventListener("click", e => {
  e.preventDefault();
  let msg = "سڵاو، دەمەوێت لەسەر ئەم بەرهەمە بپرسم: " + CURRENT.name;
  if(CURRENT.variants) msg += " (قەبارەی: " + CURRENT.variants[selectedVariantIndex].size + ")";
  window.open("https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(msg), "_blank");
});

(async () => {
  await loadProducts();
  renderDetail();
  updateCartBadge();
})();
</script>
</body>
</html>
