<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>وردەکاری بەرهەم | Sara Beauty Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#1d5c5b; /* ڕەنگی سەوزی تاریک بۆ دوگمەکان و نرخ */
  --ink:#222;
  --muted:#666;
  --bg:#ffffff;
  --line:#eaeaea;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Noto Kufi Arabic',Tahoma,sans-serif;
  line-height:1.8;
  font-size:15px;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
img{max-width:100%;display:block}

/* ============ HEADER ============ */
header{
  position:sticky;top:0;z-index:50;
  background:#fff;
  border-bottom:1px solid var(--line);
  padding:12px 0;
}
.container{width:min(800px,calc(100% - 24px));margin:auto}
.nav{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
}
.brand{font-size:22px;font-weight:700;letter-spacing:-.5px}
.nav-icons{display:flex;align-items:center;gap:16px}
.icon-btn{position:relative;display:flex;flex-direction:column;align-items:center;font-size:11px;gap:2px}
.icon-btn svg{width:22px;height:22px;stroke-width:1.8}
.cart-count{
  position:absolute;top:-4px;right:-6px;
  background:var(--teal);color:#fff;
  font-size:9px;font-weight:700;
  min-width:16px;height:16px;border-radius:50%;
  display:grid;place-items:center;
}

/* ============ PRODUCT DETAIL (NEW CLEAN DESIGN) ============ */
.product-wrap{
  padding: 20px 0 100px; /* بۆشایی لە خوارەوە بۆ دوگمەکە */
}
.main-image{
  width: 100%;
  aspect-ratio: 1/1;
  border-radius: 20px;
  overflow: hidden;
  background: #f5f5f5;
  margin-bottom: 24px;
}
.main-image img{
  width: 100%;height: 100%;object-fit: cover;
}
.main-image .placeholder{
  width: 100%;height: 100%;display:grid;place-items:center;font-size:50px;color:#ccc;
}

.prod-title{
  font-size: 22px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 10px;
  line-height: 1.4;
}
.prod-title small{
  display: block;
  font-size: 15px;
  color: var(--muted);
  font-weight: 400;
  margin-top: 4px;
}

.prod-price{
  font-size: 26px;
  font-weight: 700;
  color: var(--teal);
  margin-bottom: 24px;
}

.prod-desc{
  font-size: 15px;
  color: var(--ink);
  line-height: 2;
  margin-bottom: 30px;
  white-space: pre-wrap; /* بۆ پاراستنی دێڕەکان (Enter) لە نووسینەکەتدا */
}

/* ============ BOTTOM ACTION BAR ============ */
.bottom-bar{
  position: fixed;
  bottom: 0;left: 0;right: 0;
  background: #fff;
  padding: 12px 16px;
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 90;
  box-shadow: 0 -4px 12px rgba(0,0,0,.03);
}
.qty-box{
  display: flex;
  align-items: center;
  border: 1px solid #ccc;
  border-radius: 999px;
  height: 48px;
  overflow: hidden;
}
.qty-box button{
  width: 40px;height: 100%;
  font-size: 18px;color: var(--ink);
  display: grid;place-items: center;
}
.qty-box input{
  width: 40px;height: 100%;
  text-align: center;border: 0;outline: 0;
  font-family: inherit;font-size: 15px;font-weight: 600;
  background: transparent;
}
.btn-add{
  flex: 1;
  height: 48px;
  background: var(--teal);
  color: #fff;
  border-radius: 999px;
  font-size: 16px;
  font-weight: 600;
  display: flex;align-items: center;justify-content: center;gap: 8px;
  transition: .2s;
}
.btn-add:hover{background: #154645}

/* ============ FLOATING WA ============ */
.wa-float{
  position:fixed;bottom:80px;left:20px; /* بەرزکراوەتەوە بۆ ئەوەی لەگەڵ دوگمەکە نەیەت */
  width:50px;height:50px;border-radius:50%;
  background:#25a85a;color:#fff;
  display:grid;place-items:center;
  box-shadow:0 6px 18px rgba(37,168,90,.4);
  z-index:60;
}
.wa-float svg{width:24px;height:24px}

/* ============ TOAST ============ */
.toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(10px);
  background:#222;color:#fff;
  padding:10px 20px;border-radius:10px;
  font-size:12px;z-index:70;
  opacity:0;pointer-events:none;transition:.3s;
  white-space: nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(min-width:600px){
  .prod-title{font-size: 26px}
  .prod-price{font-size: 30px}
}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="container nav">
    <a href="index.html" class="icon-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </a>
    <a href="index.html" class="brand">Sara Beauty Shop</a>
    <button class="icon-btn" id="openCart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>
</header>

<main class="container product-wrap" id="productWrap">
  <!-- Loading State -->
  <div style="text-align:center;padding:50px 0;color:var(--muted)">بەرهەم بار دەکرێت...</div>
</main>

<!-- BOTTOM ACTION BAR -->
<div class="bottom-bar" id="actionBar" style="display:none">
  <div class="qty-box">
    <button type="button" id="qtyMinus">−</button>
    <input type="number" id="qtyInput" value="1" min="1" readonly>
    <button type="button" id="qtyPlus">+</button>
  </div>
  <button class="btn-add" id="addToCartBtn">زیادکردن بۆ سەبەتە</button>
</div>

<!-- FLOATING WA -->
<a href="#" class="wa-float" id="waFloat">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
</a>

<div class="toast" id="toast"></div>

<!-- CART PANEL (کورتکراوە) -->
<aside id="cartPanel" style="position:fixed;top:0;left:0;width:min(400px,100%);height:100dvh;background:#fff;box-shadow:0 0 0 100vmax rgba(0,0,0,.4);transform:translateX(-110%);transition:transform .3s;padding:20px;display:flex;flex-direction:column;z-index:100">
  <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px">
    <h3 style="font-size:18px">سەبەتەی کڕین</h3>
    <button id="closeCart" style="font-size:20px;color:#777">✕</button>
  </div>
  <div id="cartItems" style="flex:1;overflow:auto;padding-bottom:16px"></div>
  <div style="border-top:1px solid var(--line);padding-top:16px">
    <div style="display:flex;justify-content:space-between;font-weight:700;margin-bottom:14px;font-size:15px">
      <span>کۆی گشتی</span>
      <span id="cartTotal" style="color:var(--teal)">٠ د.ع</span>
    </div>
    <button class="btn-add" id="checkoutBtn" style="width:100%">ناردنی داواکاری بە واتساپ</button>
  </div>
</aside>

<script>
const WHATSAPP_NUMBER = "9647744484966";
let PRODUCTS = [];
let CURRENT = null;
let qty = 1;

const fmt = n => new Intl.NumberFormat("ckb-IQ").format(n) + " د.ع";
const escapeHTML = v => String(v??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function loadProducts(){
  try{
    const r = await fetch('products.json', {cache:'no-store'});
    if(r.ok){ const d = await r.json(); if(Array.isArray(d)) PRODUCTS = d; }
  }catch(e){ console.warn(e); }
}

function getId(){
  const params = new URLSearchParams(location.search);
  return params.get("id");
}

function renderDetail(){
  const id = getId();
  CURRENT = PRODUCTS.find(p => p.id === id);
  const wrap = document.getElementById("productWrap");

  if(!CURRENT){
    wrap.innerHTML = '<div style="text-align:center;padding:80px 0;color:var(--muted)">بەرهەمەکە نەدۆزرایەوە 🌸<br><br><a href="index.html" style="color:var(--teal);font-weight:bold">گەڕانەوە بۆ ماڵەوە</a></div>';
    return;
  }

  document.title = CURRENT.name + " | Sara Beauty Shop";
  document.getElementById("actionBar").style.display = "flex";

  const visual = CURRENT.image 
    ? `<img src="${escapeHTML(CURRENT.image)}" alt="${escapeHTML(CURRENT.name)}">` 
    : `<div class="placeholder">📦</div>`;

  wrap.innerHTML = `
    <div class="main-image">
      ${visual}
    </div>
    <h1 class="prod-title">
      ${escapeHTML(CURRENT.name)}
      ${CURRENT.english ? `<small>${escapeHTML(CURRENT.english)}</small>` : ""}
    </h1>
    <div class="prod-price">${fmt(CURRENT.price)}</div>
    
    <div class="prod-desc">
      ${escapeHTML(CURRENT.desc || "هیچ وەسفێک بۆ ئەم بەرهەمە نەنووسراوە.")}
    </div>
  `;
}

function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2000);
}

function updateCartBadge(){
  let cart = {};
  try{ cart = JSON.parse(localStorage.getItem("saraCart") || "{}"); }catch(e){}
  const count = Object.values(cart).reduce((s,n) => s + n, 0);
  document.getElementById("cartCount").textContent = count;
}

/* Events */
document.getElementById("qtyMinus").addEventListener("click", () => { if(qty > 1){ qty--; document.getElementById("qtyInput").value = qty; } });
document.getElementById("qtyPlus").addEventListener("click", () => { qty++; document.getElementById("qtyInput").value = qty; });

document.getElementById("addToCartBtn").addEventListener("click", () => {
  if(!CURRENT) return;
  let cart = {};
  try{ cart = JSON.parse(localStorage.getItem("saraCart") || "{}"); }catch(e){}
  cart[CURRENT.id] = (cart[CURRENT.id] || 0) + qty;
  localStorage.setItem("saraCart", JSON.stringify(cart));
  updateCartBadge();
  toast(qty + " دانە زیادکرا بۆ سەبەتە 🌸");
});

document.getElementById("waFloat").addEventListener("click", e => {
  e.preventDefault();
  window.open("https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent("سڵاو، دەمەوێت لەسەر ئەم بەرهەمە بپرسم: " + CURRENT.name), "_blank");
});

/* INIT */
(async () => {
  await loadProducts();
  renderDetail();
  updateCartBadge();
})();
</script>
</body>
</html>
